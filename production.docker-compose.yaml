services:
  server:
    image: ghcr.io/aau-se2-monopoly/aau-se2-backend:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "53208:8080"
    volumes:
      # The app's working directory is /app (see Dockerfile), so the default
      # project-relative "data" folder resolves to /app/data inside the container.
      - monopoly-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 1g

volumes:
  monopoly-data:
